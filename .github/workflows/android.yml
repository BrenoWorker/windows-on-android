name: Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Fetch UnRAR source
        run: |
          git clone https://github.com/pmachapman/unrar app/src/main/cpp/third_party/unrar
          git -C app/src/main/cpp/third_party/unrar checkout cacdcb8cbe1813b6151e3f92f2ccec7afe4d6a41

      - name: Fetch proot
        run: |
          sudo apt-get install -y patchelf
          REPO=https://packages.termux.dev/apt/termux-main
          curl -fsSL "$REPO/dists/stable/main/binary-aarch64/Packages" -o "$RUNNER_TEMP/Packages"
          pkgfile() { awk -v p="$1" '$1=="Package:"{cur=$2} cur==p && $1=="Filename:"{print $2; exit}' "$RUNNER_TEMP/Packages"; }
          mkdir -p "$RUNNER_TEMP/termux" app/src/main/jniLibs/arm64-v8a
          for p in proot libtalloc; do
            f="$(pkgfile "$p")"
            test -n "$f"
            curl -fsSL "$REPO/$f" -o "$RUNNER_TEMP/$p.deb"
            rm -rf "$RUNNER_TEMP/deb" && mkdir "$RUNNER_TEMP/deb"
            (cd "$RUNNER_TEMP/deb" && ar x "../$p.deb" && tar -xf data.tar.* -C "$RUNNER_TEMP/termux")
          done
          U="$RUNNER_TEMP/termux/data/data/com.termux/files/usr"
          L=app/src/main/jniLibs/arm64-v8a
          cp "$U/bin/proot" "$L/libproot.so"
          cp "$U/libexec/proot/loader" "$L/libproot-loader.so"
          cp -L "$U/lib/libtalloc.so.2" "$L/libtalloc.so"
          patchelf --replace-needed libtalloc.so.2 libtalloc.so "$L/libproot.so"
          patchelf --remove-rpath "$L/libproot.so"
          patchelf --set-soname libtalloc.so "$L/libtalloc.so"
          readelf -d "$L/libproot.so" | grep NEEDED

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WinDroid-arm64-v8a
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
